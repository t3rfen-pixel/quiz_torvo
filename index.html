<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الشخصية النفسي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #171717;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(255, 0, 0, 0.2);
            border: 1px solid #ff1a1a;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #ff3333;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cccccc;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #222;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #ff3333;
        }
        .btn {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #cc0000;
        }
        .option-btn {
            background-color: #262626;
            color: #fff;
            border: 1px solid #404040;
            padding: 14px;
            margin: 8px 0;
            border-radius: 6px;
            width: 100%;
            text-align: right;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
        }
        .option-btn:hover {
            border-color: #ff3333;
            background-color: #333;
        }
        .option-btn.selected {
            background-color: #ff1a1a;
            border-color: #ff0000;
        }
        .hidden {
            display: none;
        }
        .progress-bar {
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
        }
        .result-box {
            background-color: #222;
            border: 1px dashed #ff3333;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            font-size: 24px;
            letter-spacing: 2px;
            color: #ff3333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- مرحلة تسجيل الاسم -->
        <div id="step-start">
            <h2>اختبار التحليل النفسي</h2>
            <p style="color: #aaa; margin-bottom: 20px;">أدخل اسمك للبدء في تحليل نمط شخصيتك الخفي</p>
            <div class="input-group">
                <label for="username">الاسم أو اللقب:</label>
                <input type="text" id="username" placeholder="اكتب اسمك هنا...">
            </div>
            <button class="btn" onclick="startQuiz()">ابدأ الاختبار</button>
        </div>

        <!-- مرحلة الأسئلة -->
        <div id="step-quiz" class="hidden">
            <div class="progress-bar" id="progress-text">السؤال 1 / 10</div>
            <h3 id="question-text" style="margin-bottom: 20px; font-size: 18px;"></h3>
            <div id="options-container"></div>
            <button class="btn" onclick="nextQuestion()" style="margin-top: 20px;">التالي</button>
        </div>

        <!-- مرحلة النتيجة -->
        <div id="step-result" class="hidden">
            <h2 style="color: #4dff4d;">تم تحليل الشخصية بنجاح</h2>
            <p style="color: #ccc; margin-top: 15px;">بناءً على إجاباتك وتحليل الخوارزمية، رمز نمط شخصيتك المعتمد هو:</p>
            <div class="result-box">TRV-L61H</div>
            <p style="color: #888; margin-top: 15px; font-size: 13px;">احتفظ بهذا الرمز للتحقق من نمطك.</p>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://intention-qualification-buy-recommend.trycloudflare.com/api/answer";

        let currentUser = "";
        let currentQuestionIndex = 0;
        let selectedOption = null;

        const questions = [
            {
                q: "كيف تتعامل مع المواقف الضغاطة والصعبة؟",
                options: ["1. بالهدوء والتفكير العقلاني", "2. بالانسحاب ومراجعة نفسي", "3. بالمواجهة الحادة والرد الفوري", "4. بالقلق والتوتر شديد"]
            },
            {
                q: "ما هو الشيء الأكثر أهمية بالنسبة لك في علاقاتك؟",
                options: ["1. الولاء الثابت والثقة", "2. الحرية وعدم التقييد", "3. الاحترام المتبادل", "4. التفاهم العميق بدون كلام"]
            },
            {
                q: "ما هي ردة فعلك عند تعرضك للخيانة أو الخذلان؟",
                options: ["1. الشطب النهائي والقطع التام", "2. الانتقام الصامت", "3. المواجهة وإظهار الغضب", "4. التغاضي وإعطاء فرصة ثانية"]
            },
            {
                q: "كيف يقيمك أصدقاؤك المقربون عادةً؟",
                options: ["1. شخص غامض وصعب الفهم", "2. شخص قيادي وصارم", "3. شخص مرح وداعم", "4. شخص هادئ ومستمع"]
            },
            {
                q: "ما هو الوقت المفضل لديك للتفكير والإنجاز؟",
                options: ["1. منتصف الليل والهدوء التام", "2. الصباح الباكر", "3. تحت الضغط قبل الموعد", "4. في أي وقت حسب المزاج"]
            },
            {
                q: "كيف تقيم قدرتك على التحكم في انفعالاتك؟",
                options: ["1. ضعيفة جداً وأغضب بسرعة", "2. ممتازة ولا أظهر مشاعري", "3. متوسطة حسب الموقف", "4. أتحكم بظاهري فقط والداخل يشتعل"]
            },
            {
                q: "ما هو الخوف الأكبر بالنسبة لك؟",
                options: ["1. الفشل وضياع الأهداف", "2. الوحدة والتجاهل", "3. الاستغلال والضعف", "4. فقدان السيطرة"]
            },
            {
                q: "إذا تخيرت بين السلطة أو الهدوء والسلام الداخلي؟",
                options: ["1. السلطة والتحكم", "2. الهدوء والسلام الداخلي", "3. كلاهما حسب المرحلة", "4. لا يهمني أي منهما"]
            },
            {
                q: "كيف تتخذ قراراتك المصيرية عادةً؟",
                options: ["1. بالمنطق والتحليل فقط", "2. بالحدس والإحساس الداخلي", "3. باستشارة الآخرين", "4. المراهنة والاندفاع"]
            },
            {
                q: "ما هي النظرة العامة التي تنظر بها للحياة؟",
                options: ["1. ساحة معركة وتنافس", "2. رحلة مؤقتة للتجربة", "3. غموض يحتاج إلى فهم", "4. فرصة للإنجاز والتركيز"]
            }
        ];

        function startQuiz() {
            const nameInput = document.getElementById('username').value.trim();
            if (!nameInput) {
                alert("برجاء أدخل اسمك أولاً للبدء!");
                return;
            }
            currentUser = nameInput;
            document.getElementById('step-start').classList.add('hidden');
            document.getElementById('step-quiz').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            selectedOption = null;
            const qData = questions[currentQuestionIndex];
            document.getElementById('progress-text').innerText = `السؤال ${currentQuestionIndex + 1} / ${questions.length}`;
            document.getElementById('question-text').innerText = qData.q;
            
            const container = document.getElementById('options-container');
            container.innerHTML = "";

            qData.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedOption = opt;
                };
                container.appendChild(btn);
            });
        }

        function nextQuestion() {
            if (!selectedOption) {
                alert("يرجى اختيار إجابة أولاً!");
                return;
            }

            // إرسال الإجابة للسيرفر
            sendDataToServer(currentUser, currentQuestionIndex + 1, selectedOption);

            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                document.getElementById('step-quiz').classList.add('hidden');
                document.getElementById('step-result').classList.remove('hidden');
            }
        }

        function sendDataToServer(user, qIndex, answer) {
            fetch(SERVER_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    user: user,
                    questionIndex: qIndex,
                    answer: answer
                })
            }).catch(err => console.log("Error sending data:", err));
        }
    </script>
</body>
</html>
