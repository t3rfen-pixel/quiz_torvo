<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الشخصية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
            direction: rtl;
        }
        .quiz-container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .question {
            font-size: 18px;
            margin-bottom: 15px;
        }
        .options button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .options button:hover {
            background-color: #0056b3;
        }
        #result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            color: #28a745;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz">
        <div class="question" id="question-text">جاري تحميل السؤال...</div>
        <div class="options" id="options-container"></div>
    </div>
    <div id="result" style="display: none;"></div>
</div>

<script>
    // ⬇️ السطر اللي اتغير هو السطر رقم 54 (تعديل رابط السيرفر)
    const SERVER_URL = "https://walking-edit-receive-administrators.trycloudflare.com/api/answer";

    const questions = [
        {
            question: "ما هو أسلوبك المفضل في قضاء العطلة؟",
            options: ["الاسترخاء على الشاطئ", "مغامرة في الجبال", "قراءة كتاب في المنزل", "حفلة مع الأصدقاء"]
        },
        {
            question: "كيف تتعامل مع المواقف الصعبة؟",
            options: ["بالتفكير الهادئ والتخطيط", "بالتفكير السريع والعمل المباشر", "طلب المساعدة من الآخرين", "تجنب الموقف حتى يهدأ"]
        }
    ];

    let currentQuestionIndex = 0;
    const userAnswers = [];

    function showQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById("question-text").innerText = q.question;
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        q.options.forEach(option => {
            const btn = document.createElement("button");
            btn.innerText = option;
            btn.onclick = () => selectAnswer(option);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(answer) {
        userAnswers.push({
            question: questions[currentQuestionIndex].question,
            answer: answer
        });

        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        document.getElementById("quiz").style.display = "none";
        const resultDiv = document.getElementById("result");
        resultDiv.style.display = "block";
        resultDiv.innerText = "جاري تحليل إجاباتك...";

        fetch(SERVER_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ answers: userAnswers })
        })
        .then(response => response.json())
        .then(data => {
            resultDiv.innerText = "شكراً لمشاركتك! تم تحليلك بنجاح.";
        })
        .catch(error => {
            console.error("Error:", error);
            resultDiv.innerText = "شكراً لمشاركتك!";
        });
    }

    showQuestion();
</script>

</body>
</html>
